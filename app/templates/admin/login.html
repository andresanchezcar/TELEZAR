<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesion — Panel Telezar</title>
  <link rel="icon" href="{{ settings.get('favicon', '/static/img/logo.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=asset_v) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css', v=asset_v) }}">
</head>
<body class="login-body">
  <div class="login-card">
    <img class="login-logo" src="{{ settings.get('site_logo') or url_for('static', filename='img/logo.png') }}" alt="Telezar">
    <!-- <h1>Panel de administracion</h1>
    <p class="login-sub">Ingrese sus credenciales para gestionar el contenido del sitio.</p> -->

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="flash-stack">
        {% for category, msg in messages %}
        <div class="flash flash-{{ category }}"><span>{{ msg }}</span></div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input class="form-control" type="text" id="username" name="username" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contrasena</label>
        <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <div class="form-check">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Mantener sesion iniciada</label>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
    </form>

    <a class="login-back" href="{{ url_for('public.index') }}">&larr; Volver al sitio</a>
  </div>
</body>
</html>
