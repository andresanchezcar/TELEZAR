{% extends "admin/base.html" %}
{% block title %}Mi perfil{% endblock %}
{% block admin_title %}Mi perfil{% endblock %}

{% block admin_content %}
<form class="panel form-panel" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label for="full_name">Nombre completo</label>
    <input class="form-control" type="text" id="full_name" name="full_name" value="{{ user.full_name or '' }}">
  </div>
  <div class="form-group">
    <label for="email">Correo electronico</label>
    <input class="form-control" type="email" id="email" name="email" value="{{ user.email or '' }}">
  </div>
  <h3 class="form-section-title">Cambiar contrasena</h3>
  <div class="form-group">
    <label for="current_password">Contrasena actual</label>
    <input class="form-control" type="password" id="current_password" name="current_password" autocomplete="current-password">
  </div>
  <div class="form-row">
    <div class="form-group">
      <label for="new_password">Nueva contrasena</label>
      <input class="form-control" type="password" id="new_password" name="new_password" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirmar contrasena</label>
      <input class="form-control" type="password" id="confirm_password" name="confirm_password" autocomplete="new-password">
    </div>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Guardar cambios</button>
  </div>
</form>
{% endblock %}
